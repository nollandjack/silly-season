<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Silly Season Session</title>
<meta name="description" content="Sign up for a dish at the Silly Season Session">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎄</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,800&family=Nunito:wght@400;600;800&display=swap" rel="stylesheet">
<style>
  :root {
    --pine: #123d2b;
    --pine-2: #1d5a3f;
    --berry: #b3261e;
    --berry-soft: #f7d9d6;
    --mint-soft: #dcefe2;
    --gold: #e0a526;
    --cream: #fbf6ec;
    --ink: #1f2420;
    --muted: #5f6b63;
    --card: #ffffff;
    --line: #eadfca;
    --radius: 18px;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    font-family: Nunito, system-ui, -apple-system, sans-serif;
    color: var(--ink);
    background: var(--pine);
    min-height: 100vh;
    -webkit-tap-highlight-color: transparent;
  }
  #snow { position: fixed; inset: 0; pointer-events: none; z-index: 0; }
  .wrap { position: relative; z-index: 1; max-width: 560px; margin: 0 auto; padding: 0 16px 120px; }

  header { text-align: center; color: #fff; padding: 32px 0 18px; }
  header .tree { font-size: 44px; display: inline-block; animation: sway 3s ease-in-out infinite; }
  h1 { font-family: Fraunces, Georgia, serif; font-weight: 800; font-size: 34px; line-height: 1.05; margin: 6px 0 8px; letter-spacing: -0.5px; }
  h1 span { color: var(--gold); }
  .tag { display: inline-block; background: rgba(255,255,255,.12); border: 1px solid rgba(255,255,255,.25); padding: 7px 14px; border-radius: 999px; font-weight: 800; font-size: 14px; }

  .spread { background: rgba(255,255,255,.08); border: 1px dashed rgba(255,255,255,.3); border-radius: var(--radius); padding: 12px; margin: 14px 0 6px; min-height: 76px; display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; align-items: center; }
  .spread .hint { color: rgba(255,255,255,.75); font-size: 14px; }
  .food { font-size: 30px; display: inline-block; animation: bob 2.6s ease-in-out infinite; }
  .food.pop { animation: pop .9s cubic-bezier(.2,1.6,.4,1) both, bob 2.6s ease-in-out .9s infinite; }
  .steps { color: rgba(255,255,255,.85); font-size: 14px; text-align: center; margin: 10px 4px 18px; line-height: 1.5; }

  .card { background: var(--cream); border-radius: var(--radius); margin: 14px 0; overflow: hidden; box-shadow: 0 8px 24px rgba(0,0,0,.18); }
  .card h2 { margin: 0; padding: 12px 16px; font-family: Fraunces, Georgia, serif; font-size: 20px; color: #fff; display: flex; align-items: center; gap: 8px; }
  .card.red h2 { background: var(--berry); }
  .card.green h2 { background: var(--pine-2); }
  .card h2 small { margin-left: auto; font-family: Nunito, sans-serif; font-size: 13px; font-weight: 800; opacity: .9; }
  .rows { padding: 6px 10px 10px; }
  .row { display: flex; align-items: center; gap: 10px; width: 100%; text-align: left; border: 0; background: var(--card); border-radius: 12px; padding: 12px; margin: 6px 0; font: inherit; color: inherit; cursor: pointer; border: 1px solid var(--line); min-height: 52px; }
  .row:active { transform: scale(.985); }
  .num { width: 24px; height: 24px; border-radius: 50%; display: grid; place-items: center; font-size: 12px; font-weight: 800; background: var(--line); color: var(--muted); flex: none; }
  .row .main { flex: 1; min-width: 0; }
  .row .who { font-weight: 800; }
  .row .what { color: var(--muted); font-size: 14px; overflow-wrap: anywhere; }
  .row .emo { font-size: 24px; flex: none; }
  .row.empty { background: transparent; border-style: dashed; }
  .row.empty .who { color: var(--muted); font-weight: 600; }
  .card.red .row.taken { background: var(--berry-soft); border-color: #efc3bf; }
  .card.green .row.taken { background: var(--mint-soft); border-color: #c5e3cf; }
  .pill { font-size: 12px; font-weight: 800; padding: 3px 8px; border-radius: 999px; background: var(--pine-2); color: #fff; flex: none; }
  .pill.no { background: #d8d2c4; color: var(--ink); }
  .guest .diet { color: var(--berry); font-weight: 700; font-size: 14px; }
  .guest .add { color: var(--muted); font-size: 13px; }

  .fab { position: fixed; right: 16px; bottom: calc(18px + env(safe-area-inset-bottom)); z-index: 5; border: 0; border-radius: 999px; padding: 14px 20px; background: var(--gold); color: #2b1d00; font: 800 16px Nunito, sans-serif; box-shadow: 0 10px 24px rgba(0,0,0,.3); cursor: pointer; animation: glow 2.4s ease-in-out infinite; }

  .sheet-bg { position: fixed; inset: 0; background: rgba(0,0,0,.45); z-index: 10; display: none; }
  .sheet { position: fixed; left: 0; right: 0; bottom: 0; z-index: 11; background: var(--cream); border-radius: 22px 22px 0 0; padding: 18px 16px calc(20px + env(safe-area-inset-bottom)); max-width: 560px; margin: 0 auto; transform: translateY(105%); transition: transform .28s ease; max-height: 88vh; overflow-y: auto; }
  .sheet.open { transform: translateY(0); }
  .sheet h3 { font-family: Fraunces, Georgia, serif; margin: 0 0 12px; font-size: 22px; }
  label { display: block; font-weight: 800; font-size: 14px; margin: 12px 0 6px; }
  input, select, textarea { width: 100%; font: 16px Nunito, sans-serif; padding: 13px 12px; border-radius: 12px; border: 1px solid #d9ccb2; background: #fff; color: var(--ink); }
  textarea { resize: vertical; min-height: 70px; }
  .toggle { display: flex; gap: 8px; }
  .toggle button { flex: 1; padding: 12px; border-radius: 12px; border: 1px solid #d9ccb2; background: #fff; font: 800 15px Nunito, sans-serif; cursor: pointer; color: var(--ink); }
  .toggle button.on { background: var(--pine-2); color: #fff; border-color: var(--pine-2); }
  .actions { display: flex; gap: 10px; margin-top: 18px; }
  .btn { flex: 1; padding: 14px; border-radius: 14px; border: 0; font: 800 16px Nunito, sans-serif; cursor: pointer; }
  .btn.go { background: var(--berry); color: #fff; }
  .btn.ghost { background: #ece3d1; color: var(--ink); }
  .btn:disabled { opacity: .6; }
  .err { color: var(--berry); font-weight: 700; font-size: 14px; margin-top: 10px; min-height: 1em; }
  .answer { background: #fff; border: 1px solid var(--line); border-radius: 14px; padding: 12px; margin-top: 12px; white-space: pre-wrap; line-height: 1.5; display: none; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
  .chip { border: 1px solid #d9ccb2; background: #fff; border-radius: 999px; padding: 7px 11px; font: 600 13px Nunito, sans-serif; cursor: pointer; color: var(--ink); }
  .status { color: rgba(255,255,255,.8); text-align: center; font-size: 13px; margin-top: 18px; }
  .toast { position: fixed; left: 50%; top: 16px; transform: translateX(-50%) translateY(-120%); background: #fff; color: var(--ink); padding: 10px 16px; border-radius: 999px; font-weight: 800; z-index: 20; transition: transform .3s ease; box-shadow: 0 8px 20px rgba(0,0,0,.25); }
  .toast.show { transform: translateX(-50%) translateY(0); }
  .burst { position: fixed; z-index: 30; pointer-events: none; font-size: 26px; animation: fly 1.2s ease-out forwards; }

  @keyframes sway { 0%,100% { transform: rotate(-6deg); } 50% { transform: rotate(6deg); } }
  @keyframes bob { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-6px); } }
  @keyframes pop { 0% { transform: scale(0) rotate(-30deg); } 100% { transform: scale(1) rotate(0); } }
  @keyframes glow { 0%,100% { box-shadow: 0 10px 24px rgba(0,0,0,.3); } 50% { box-shadow: 0 10px 30px rgba(224,165,38,.7); } }
  @keyframes fly { 0% { opacity: 1; transform: translate(0,0) scale(.6); } 100% { opacity: 0; transform: translate(var(--dx), var(--dy)) scale(1.3) rotate(var(--rot)); } }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition: none !important; }
  }
</style>
</head>
<body>
<canvas id="snow" aria-hidden="true"></canvas>
<div class="wrap">
  <header>
    <div class="tree" aria-hidden="true">🎄</div>
    <h1>Silly Season <span>Session</span></h1>
    <div class="tag">Bring your best 🏆 every dish gets voted on and ranked</div>
    <div class="spread" id="spread" aria-label="Dishes on the table so far"><span class="hint">The table is empty. Be the first to bring something 🍽️</span></div>
    <p class="steps">1. Add any dietary needs next to your name<br>2. Tap an empty spot to bring a dish or two</p>
  </header>
  <main id="app"></main>
  <p class="status" id="status">Loading the guest list…</p>
</div>

<button class="fab" id="askBtn" type="button" hidden>✨ Ask Claude for ideas</button>

<div class="sheet-bg" id="sheetBg"></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle"></div>
<div class="toast" id="toast" role="status"></div>

<script>
// Web app URL of the Apps Script behind the Google Sheet.
const API = 'https://script.google.com/macros/s/AKfycbwDcgvkEDjfJ-YpMYGz-EcbRik1RhIupNiDYU79VLjWmAqJv2cNbxsd2imU3jBQ1p7F/exec';

let state = null;
let knownDishes = new Set();
let sheetOpen = false;

const $ = (id) => document.getElementById(id);
const el = (tag, cls, text) => {
  const n = document.createElement(tag);
  if (cls) n.className = cls;
  if (text != null) n.textContent = text;
  return n;
};

async function api(body) {
  const res = body
    ? await fetch(API, { method: 'POST', body: JSON.stringify(body) })
    : await fetch(API);
  if (!res.ok) throw new Error('Could not reach the sign-up sheet');
  return res.json();
}

async function load(quiet) {
  try {
    const data = await api();
    if (!data.ok) throw new Error(data.error || 'Something went wrong');
    setState(data.state);
    $('status').textContent = 'Live from the sign-up sheet. Updates every 20 seconds.';
  } catch (e) {
    if (!quiet) $('status').textContent = 'Could not load the sign-ups. Pull down to refresh in a moment.';
  }
}

function setState(next) {
  state = next;
  render();
  $('askBtn').hidden = !state.claude;
}

function render() {
  const app = $('app');
  app.replaceChildren();

  // Guest list
  const g = el('section', 'card red');
  const gh = el('h2', null, '🎅 Who\'s coming');
  gh.append(el('small', null, state.guests.length + ' guests'));
  g.append(gh);
  const gr = el('div', 'rows');
  state.guests.forEach((guest, i) => {
    const b = el('button', 'row guest taken');
    b.type = 'button';
    const main = el('div', 'main');
    main.append(el('div', 'who', guest.name || 'Guest ' + (i + 1)));
    main.append(guest.diet ? el('div', 'diet', guest.diet) : el('div', 'add', 'Tap to add dietary needs'));
    b.append(el('span', 'num', String(i + 1)), main);
    b.addEventListener('click', () => openDiet(i));
    gr.append(b);
  });
  g.append(gr);
  app.append(g);

  // Food sections, alternating green and red
  const icons = { entrees: '🥨', mains: '🍗', desserts: '🍰', cocktail: '🍹' };
  state.sections.forEach((s, si) => {
    const c = el('section', 'card ' + (si % 2 === 0 ? 'green' : 'red'));
    const h = el('h2', null, icons[s.key] + ' ' + s.label);
    const free = s.slots.filter(x => !x.name && !x.dish).length;
    h.append(el('small', null, free ? free + ' spots left' : 'Full 🎉'));
    c.append(h);
    const rows = el('div', 'rows');
    s.slots.forEach((slot, i) => {
      const filled = !!(slot.name || slot.dish);
      const b = el('button', 'row ' + (filled ? 'taken' : 'empty'));
      b.type = 'button';
      const main = el('div', 'main');
      if (filled) {
        main.append(el('div', 'who', slot.name || 'Someone'));
        main.append(el('div', 'what', slot.dish || 'Dish to be revealed'));
      } else {
        main.append(el('div', 'who', 'Tap to bring something'));
      }
      b.append(el('span', 'num', String(i + 1)), main);
      if (filled && s.veg && slot.veg) {
        const yes = /^y/i.test(slot.veg);
        b.append(el('span', 'pill' + (yes ? '' : ' no'), yes ? 'Veg' : 'Not veg'));
      }
      if (filled && slot.dish) b.append(el('span', 'emo', slot.emoji || '🍽️'));
      b.addEventListener('click', (ev) => openSlot(s, i, ev));
      rows.append(b);
    });
    c.append(rows);
    app.append(c);
  });

  renderSpread();
}

function renderSpread() {
  const spread = $('spread');
  const dishes = [];
  state.sections.forEach(s => s.slots.forEach(x => { if (x.dish) dishes.push((x.emoji || '🍽️') + '|' + x.dish); }));
  spread.replaceChildren();
  if (!dishes.length) {
    spread.append(el('span', 'hint', 'The table is empty. Be the first to bring something 🍽️'));
    return;
  }
  const firstLoad = knownDishes.size === 0;
  dishes.forEach((d, i) => {
    const [emoji, name] = d.split('|');
    const isNew = !firstLoad && !knownDishes.has(d);
    const f = el('span', 'food' + (isNew ? ' pop' : ''), emoji);
    f.title = name;
    f.style.animationDelay = isNew ? '0s, .9s' : (i * 0.18) + 's';
    spread.append(f);
  });
  knownDishes = new Set(dishes);
}

function burst(x, y, emoji) {
  const pieces = ['✨', '🎉', '❄️', emoji || '🍽️', '⭐', emoji || '🎁'];
  for (let i = 0; i < 14; i++) {
    const p = el('span', 'burst', pieces[i % pieces.length]);
    p.style.left = x + 'px';
    p.style.top = y + 'px';
    const ang = (Math.PI * 2 * i) / 14;
    const dist = 70 + Math.random() * 70;
    p.style.setProperty('--dx', Math.cos(ang) * dist + 'px');
    p.style.setProperty('--dy', Math.sin(ang) * dist - 40 + 'px');
    p.style.setProperty('--rot', (Math.random() * 360 - 180) + 'deg');
    document.body.append(p);
    setTimeout(() => p.remove(), 1300);
  }
}

function toast(msg) {
  const t = $('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toast._t);
  toast._t = setTimeout(() => t.classList.remove('show'), 2600);
}

function openSheet(build) {
  const sh = $('sheet');
  sh.replaceChildren();
  build(sh);
  $('sheetBg').style.display = 'block';
  requestAnimationFrame(() => sh.classList.add('open'));
  sheetOpen = true;
}
function closeSheet() {
  $('sheet').classList.remove('open');
  $('sheetBg').style.display = 'none';
  sheetOpen = false;
}
$('sheetBg').addEventListener('click', closeSheet);

function field(labelText, input) {
  const wrap = el('div');
  const l = el('label', null, labelText);
  const id = 'f' + Math.random().toString(36).slice(2);
  l.htmlFor = id;
  input.id = id;
  wrap.append(l, input);
  return wrap;
}

function openSlot(section, index, ev) {
  const slot = section.slots[index];
  const filled = !!(slot.name || slot.dish);
  const point = { x: ev.clientX || window.innerWidth / 2, y: ev.clientY || 200 };
  openSheet((sh) => {
    sh.append(el('h3', null, (filled ? 'Edit ' : 'Bring ') + section.label.toLowerCase() + ' #' + (index + 1)));

    const name = el('input');
    name.setAttribute('list', 'guestNames');
    name.autocomplete = 'off';
    name.placeholder = 'Your first name';
    name.value = slot.name || '';
    const dl = el('datalist');
    dl.id = 'guestNames';
    state.guests.forEach(gst => { const o = el('option'); o.value = gst.name; dl.append(o); });
    sh.append(field('Your name', name), dl);

    const dish = el('input');
    dish.placeholder = section.key === 'cocktail' ? 'e.g. a bottle of rum, limes, mint' : 'e.g. prawn cocktail, pavlova';
    dish.value = slot.dish || '';
    sh.append(field(section.key === 'cocktail' ? 'What you\'re bringing for it' : 'Your dish', dish));

    let veg = slot.veg || '';
    if (section.veg) {
      sh.append(el('label', null, 'Is it vegetarian?'));
      const t = el('div', 'toggle');
      const yes = el('button', null, '🥦 Yes');
      const no = el('button', null, '🥩 No');
      yes.type = no.type = 'button';
      const paint = () => { yes.classList.toggle('on', /^y/i.test(veg)); no.classList.toggle('on', /^n/i.test(veg)); };
      yes.onclick = () => { veg = 'Y'; paint(); };
      no.onclick = () => { veg = 'N'; paint(); };
      paint();
      t.append(yes, no);
      sh.append(t);
    }

    const err = el('div', 'err');
    const actions = el('div', 'actions');
    if (filled) {
      const clear = el('button', 'btn ghost', 'Free this spot');
      clear.type = 'button';
      clear.onclick = () => save({ name: '', dish: '', veg: '' }, clear, err);
      actions.append(clear);
    }
    const go = el('button', 'btn go', filled ? 'Save changes' : 'Count me in 🎄');
    go.type = 'button';
    go.onclick = () => {
      if (!name.value.trim()) { err.textContent = 'Add your name first'; return; }
      if (!dish.value.trim()) { err.textContent = 'Tell everyone what you\'re bringing'; return; }
      save({ name: name.value, dish: dish.value, veg: section.veg ? veg : '' }, go, err, true);
    };
    actions.append(go);
    sh.append(err, actions);
    setTimeout(() => (filled ? dish : name).focus(), 300);

    async function save(vals, btn, errEl, celebrate) {
      btn.disabled = true;
      const old = btn.textContent;
      btn.textContent = celebrate ? 'Asking Claude to plate it up…' : 'Saving…';
      try {
        const data = await api({ type: 'slot', section: section.key, index, expectName: slot.name, name: vals.name, dish: vals.dish, veg: vals.veg });
        if (data.state) setState(data.state);
        if (!data.ok) { errEl.textContent = data.error; btn.disabled = false; btn.textContent = old; return; }
        closeSheet();
        if (celebrate) {
          const saved = data.state.sections.find(s => s.key === section.key).slots[index];
          burst(point.x, point.y, saved.emoji);
          toast('You\'re bringing ' + vals.dish.trim() + ' ' + (saved.emoji || '🎉'));
        } else {
          toast('Spot freed up');
        }
      } catch (e) {
        errEl.textContent = 'Could not save. Check your connection and try again.';
        btn.disabled = false;
        btn.textContent = old;
      }
    }
  });
}

function openDiet(index) {
  const guest = state.guests[index];
  openSheet((sh) => {
    sh.append(el('h3', null, 'Dietary needs for ' + (guest.name || 'guest ' + (index + 1))));
    const diet = el('input');
    diet.placeholder = 'e.g. vegetarian, no nuts, gluten free';
    diet.value = guest.diet || '';
    sh.append(field('Anything the cooks should know?', diet));
    const err = el('div', 'err');
    const actions = el('div', 'actions');
    const cancel = el('button', 'btn ghost', 'Cancel');
    cancel.type = 'button';
    cancel.onclick = closeSheet;
    const go = el('button', 'btn go', 'Save');
    go.type = 'button';
    go.onclick = async () => {
      go.disabled = true;
      go.textContent = 'Saving…';
      try {
        const data = await api({ type: 'diet', index, diet: diet.value });
        if (data.state) setState(data.state);
        if (!data.ok) throw new Error(data.error);
        closeSheet();
        toast('Got it, thanks ' + (guest.name || '') + ' 🎅');
      } catch (e) {
        err.textContent = 'Could not save. Try again in a moment.';
        go.disabled = false;
        go.textContent = 'Save';
      }
    };
    actions.append(cancel, go);
    sh.append(err, actions);
    setTimeout(() => diet.focus(), 300);
  });
}

function openAsk() {
  openSheet((sh) => {
    sh.append(el('h3', null, '✨ Ask Claude'));
    sh.append(el('div', 'what', 'Claude can see what\'s already been claimed and everyone\'s dietary needs.'));
    const q = el('textarea');
    q.placeholder = 'What should I bring that will win?';
    q.maxLength = 300;
    sh.append(field('Your question', q));
    const chips = el('div', 'chips');
    ['What\'s still missing?', 'A crowd-pleasing veg main?', 'Easy dessert that could win?', 'Cocktail idea for the group?'].forEach(text => {
      const c = el('button', 'chip', text);
      c.type = 'button';
      c.onclick = () => { q.value = text; };
      chips.append(c);
    });
    sh.append(chips);
    const err = el('div', 'err');
    const answer = el('div', 'answer');
    const actions = el('div', 'actions');
    const close = el('button', 'btn ghost', 'Close');
    close.type = 'button';
    close.onclick = closeSheet;
    const go = el('button', 'btn go', 'Ask');
    go.type = 'button';
    go.onclick = async () => {
      if (!q.value.trim()) { err.textContent = 'Type a question first'; return; }
      err.textContent = '';
      go.disabled = true;
      go.textContent = 'Thinking…';
      try {
        const data = await api({ type: 'ask', question: q.value });
        if (!data.ok) throw new Error(data.error);
        answer.textContent = data.answer;
        answer.style.display = 'block';
      } catch (e) {
        err.textContent = e.message || 'Claude could not answer right now.';
      }
      go.disabled = false;
      go.textContent = 'Ask again';
    };
    actions.append(close, go);
    sh.append(err, answer, actions);
  });
}
$('askBtn').addEventListener('click', openAsk);

// Gentle snowfall
(function snow() {
  const c = $('snow');
  const ctx = c.getContext('2d');
  if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  let flakes = [];
  function size() {
    c.width = innerWidth * devicePixelRatio;
    c.height = innerHeight * devicePixelRatio;
    flakes = Array.from({ length: Math.min(70, Math.round(innerWidth / 6)) }, () => ({
      x: Math.random() * c.width, y: Math.random() * c.height,
      r: (Math.random() * 2.2 + 0.8) * devicePixelRatio, s: Math.random() * 0.6 + 0.3, w: Math.random() * 2
    }));
  }
  size();
  addEventListener('resize', size);
  (function tick(t) {
    ctx.clearRect(0, 0, c.width, c.height);
    ctx.fillStyle = 'rgba(255,255,255,.75)';
    flakes.forEach(f => {
      f.y += f.s * devicePixelRatio;
      f.x += Math.sin(t / 1400 + f.w) * 0.4;
      if (f.y > c.height) { f.y = -5; f.x = Math.random() * c.width; }
      ctx.beginPath();
      ctx.arc(f.x, f.y, f.r, 0, Math.PI * 2);
      ctx.fill();
    });
    requestAnimationFrame(tick);
  })(0);
})();

load();
setInterval(() => { if (!sheetOpen && !document.hidden) load(true); }, 20000);
</script>
</body>
